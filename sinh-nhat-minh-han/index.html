<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gửi Minh Hân ♡</title><style>body{font-family:Arial,sans-serif;margin:0;background:#fffaf6;color:#4b2332}main{max-width:1100px;margin:auto;padding:40px 20px}h1{font-size:56px;color:#681b39}.hero{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}.photo{height:520px;border-radius:30px;background:url('assets/birthday-photo-sprite.webp') 0 0/300% 200%;box-shadow:0 20px 50px #0002}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:40px}.g{height:300px;border-radius:22px;background-image:url('assets/birthday-photo-sprite.webp');background-size:300% 200%}.g1{background-position:50% 0}.g2{background-position:100% 0}.g3{background-position:0 100%}.g4{background-position:50% 100%}.heart{position:fixed;bottom:-20px;color:#c96f8a;animation:up 6s linear infinite}@keyframes up{to{transform:translateY(-110vh);opacity:0}}@media(max-width:800px){.hero{grid-template-columns:1fr}.photo{height:430px}.gallery{grid-template-columns:1fr}h1{font-size:42px}}</style></head><body><main><section class="hero"><div><p>HAPPY BIRTHDAY, MY LOVE</p><h1>Chúc mừng sinh nhật,<br>Minh Hân ♡</h1><p>Hôm nay là ngày dành riêng cho em. Mong tuổi 21 của em thật rực rỡ, bình an và đầy yêu thương.</p><p><strong>29.09.2026 · From Chó Béo</strong></p></div><div class="photo"></div></section><section class="gallery"><div class="g g1"></div><div class="g g2"></div><div class="g g3"></div><div class="g g4"></div></section></main><script>for(let i=0;i<24;i++){const e=document.createElement('span');e.className='heart';e.textContent=Math.random()>.5?'♥':'♡';e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*6+'s';e.style.fontSize=(12+Math.random()*18)+'px';document.body.appendChild(e)}</script></body></html>
